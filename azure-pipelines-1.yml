# Azure DevOps pipeline for Terraform on a self-hosted Windows agent.
# High-level flow:
#   1) Optional scanners run independently and can run in parallel.
#   2) Terraform Plan runs only if every scanner/validation step selected at queue time passes.
#   3) A readable plan and the binary plan are published as an artifact.
#   4) main branch runs pause for manual approval.
#   5) Apply uses the exact saved binary plan after approval.
#
# IMPORTANT:
# - terraformDirectory points to the Terraform root folder; change it if your repo layout differs.
# - Keep the Terraform version pinned to the version approved by your repo before production use.
# - Terraform plan files/reports may contain sensitive infrastructure details; restrict artifact access.
pool:
  name: DevOps-Agents

variables:
  # Replace 'latest' with the exact approved version for reproducible Plan/Apply runs.
  terraformVersion: 'latest'
  terraformDirectory: '$(Build.SourcesDirectory)/terraform'

parameters:
  - name: runGitleaks
    displayName: Run Gitleaks Scan
    type: boolean
    default: false

  - name: runtfsec
    displayName: Run tfsec Scan
    type: boolean
    default: false

  - name: runtflint
    displayName: Run TFLint Scan
    type: boolean
    default: false

  - name: runtfvalidate
    displayName: Run Terraform Init and Validate
    type: boolean
    default: false

trigger:
  branches:
    include:
      - main
      - features/*

stages:
# 1. Gitleaks: scan Git history for secrets. fetchDepth: 0 lets it inspect history.
- stage: gitleaks
  displayName: Gitleaks Secret Scan
  dependsOn: []
  condition: eq('${{ parameters.runGitleaks }}', 'true')
  jobs:
    - job: gitleaks_scan
      displayName: Scan Repository for Secrets
      steps:
        - checkout: self
          fetchDepth: 0

        - task: PowerShell@2
          displayName: Run Gitleaks and Generate Report
          inputs:
            targetType: inline
            script: |
              $reportDir = "$(Build.ArtifactStagingDirectory)/scan-reports/gitleaks"
              New-Item -ItemType Directory -Force -Path $reportDir | Out-Null
              Set-Content "$reportDir/scan-status.txt" "Gitleaks scan started"

              gitleaks version
              if ($LASTEXITCODE -ne 0) {
                throw "Gitleaks is unavailable on the agent."
              }

              gitleaks git `
                --redact `
                --report-format json `
                --report-path "$reportDir/gitleaks-report.json" `
                --exit-code 1 `
                "$(Build.SourcesDirectory)"
              $scanExitCode = $LASTEXITCODE

              if ($scanExitCode -ne 0) {
                Set-Content "$reportDir/scan-status.txt" "Gitleaks failed or detected secrets."
                throw "Gitleaks scan failed. Review the published report."
              }

              Set-Content "$reportDir/scan-status.txt" "Gitleaks scan passed."

        - task: PublishPipelineArtifact@1
          displayName: Publish Gitleaks Report
          condition: always()
          inputs:
            targetPath: '$(Build.ArtifactStagingDirectory)/scan-reports/gitleaks'
            artifact: gitleaks-report

# 2. tfsec: scan Terraform security misconfigurations.
- stage: tfsec
  displayName: tfsec Security Scan
  dependsOn: []
  condition: eq('${{ parameters.runtfsec }}', 'true')
  jobs:
    - job: tfsec_scan
      displayName: Scan Terraform Security
      steps:
        - checkout: self

        - task: PowerShell@2
          displayName: Run tfsec and Generate Report
          inputs:
            targetType: inline
            script: |
              $reportDir = "$(Build.ArtifactStagingDirectory)/scan-reports/tfsec"
              New-Item -ItemType Directory -Force -Path $reportDir | Out-Null
              Set-Content "$reportDir/scan-status.txt" "tfsec scan started"

              tfsec --version
              if ($LASTEXITCODE -ne 0) {
                throw "tfsec is unavailable on the agent."
              }

              $tfDir = "$(terraformDirectory)"
              if (!(Test-Path $tfDir)) {
                throw "Terraform directory not found: $tfDir"
              }

              tfsec $tfDir --format json --out "$reportDir/tfsec-report.json"
              $scanExitCode = $LASTEXITCODE

              if ($scanExitCode -ne 0) {
                Set-Content "$reportDir/scan-status.txt" "tfsec failed or reported findings."
                throw "tfsec scan failed. Review the published report."
              }

              Set-Content "$reportDir/scan-status.txt" "tfsec scan passed."

        - task: PublishPipelineArtifact@1
          displayName: Publish tfsec Report
          condition: always()
          inputs:
            targetPath: '$(Build.ArtifactStagingDirectory)/scan-reports/tfsec'
            artifact: tfsec-report

# 3. TFLint: check Terraform syntax/provider-specific rules and code quality.
- stage: tflint
  displayName: TFLint Code Quality Scan
  dependsOn: []
  condition: eq('${{ parameters.runtflint }}', 'true')
  jobs:
    - job: tflint_scan
      displayName: Lint Terraform
      steps:
        - checkout: self

        - task: PowerShell@2
          displayName: Run TFLint and Generate Report
          inputs:
            targetType: inline
            script: |
              $reportDir = "$(Build.ArtifactStagingDirectory)/scan-reports/tflint"
              New-Item -ItemType Directory -Force -Path $reportDir | Out-Null
              Set-Content "$reportDir/scan-status.txt" "TFLint scan started"

              tflint --version
              if ($LASTEXITCODE -ne 0) {
                throw "TFLint is unavailable on the agent."
              }

              $tfDir = "$(terraformDirectory)"
              if (!(Test-Path $tfDir)) {
                throw "Terraform directory not found: $tfDir"
              }

              tflint --chdir="$tfDir" --init
              $initExitCode = $LASTEXITCODE
              if ($initExitCode -ne 0) {
                throw "TFLint initialization failed."
              }

              $tflintOutput = & tflint --chdir="$tfDir" --format=json
              $scanExitCode = $LASTEXITCODE
              $tflintOutput | Out-File "$reportDir/tflint-report.json" -Encoding utf8

              if ($scanExitCode -ne 0) {
                Set-Content "$reportDir/scan-status.txt" "TFLint failed or reported issues."
                throw "TFLint scan failed. Review the published report."
              }

              Set-Content "$reportDir/scan-status.txt" "TFLint scan passed."

        - task: PublishPipelineArtifact@1
          displayName: Publish TFLint Report
          condition: always()
          inputs:
            targetPath: '$(Build.ArtifactStagingDirectory)/scan-reports/tflint'
            artifact: tflint-report

# 4. Optional validation stage. Enable it when you want a separate init/validate gate.
- stage: terraform_init_validate
  displayName: Terraform Init and Validate
  dependsOn: []
  condition: eq('${{ parameters.runtfvalidate }}', 'true')
  jobs:
    - job: init_validate
      displayName: Initialize and Validate Terraform
      steps:
        - checkout: self

        - task: TerraformInstaller@1
          displayName: Install Terraform
          inputs:
            terraformVersion: '$(terraformVersion)'

        - task: TerraformTask@5
          displayName: Terraform Init
          inputs:
            provider: azurerm
            command: init
            workingDirectory: '$(terraformDirectory)'
            backendServiceArm: 'Azure-to-ADO'
            backendAzureRmStorageAccountName: 'tfstatestoragepipeline'
            backendAzureRmContainerName: 'tfstate'
            backendAzureRmKey: 'infra.tfstate'

        - task: TerraformTask@5
          displayName: Terraform Validate
          inputs:
            provider: azurerm
            command: validate
            workingDirectory: '$(terraformDirectory)'

# 5. Terraform Plan: selected checks must succeed; disabled checks may be skipped.
# Note: the scanner scripts intentionally fail their stage when findings are detected.
- stage: terraform_plan
  displayName: Terraform Plan
  dependsOn:
    - gitleaks
    - tfsec
    - tflint
    - terraform_init_validate
  # Selected checks must pass. Unselected checks are skipped and do not block Plan.
  # Keep each parameter check paired with its corresponding dependency result.
  condition: |
    and(
      not(canceled()),
      or(
        eq('${{ parameters.runGitleaks }}', 'false'),
        eq(dependencies.gitleaks.result, 'Succeeded')
      ),
      or(
        eq('${{ parameters.runtfsec }}', 'false'),
        eq(dependencies.tfsec.result, 'Succeeded')
      ),
      or(
        eq('${{ parameters.runtflint }}', 'false'),
        eq(dependencies.tflint.result, 'Succeeded')
      ),
      or(
        eq('${{ parameters.runtfvalidate }}', 'false'),
        eq(dependencies.terraform_init_validate.result, 'Succeeded')
      )
    )
  jobs:
    - job: plan
      displayName: Create Terraform Plan
      steps:
        - checkout: self

        - task: TerraformInstaller@1
          displayName: Install Terraform
          inputs:
            terraformVersion: '$(terraformVersion)'

        - task: PowerShell@2
          displayName: Create Artifact Directory
          inputs:
            targetType: inline
            script: |
              New-Item -ItemType Directory -Force `
                -Path "$(Build.ArtifactStagingDirectory)" | Out-Null
              terraform --version

        - task: TerraformTask@5
          displayName: Terraform Init
          inputs:
            provider: azurerm
            command: init
            workingDirectory: '$(terraformDirectory)'
            backendServiceArm: 'Azure-to-ADO'
            backendAzureRmStorageAccountName: 'tfstatestoragepipeline'
            backendAzureRmContainerName: 'tfstate'
            backendAzureRmKey: 'infra.tfstate'

        - task: TerraformTask@5
          displayName: Terraform Plan
          inputs:
            provider: azurerm
            command: plan
            workingDirectory: '$(terraformDirectory)'
            environmentServiceNameAzureRM: 'Azure-to-ADO'
            commandOptions: '-out="$(Build.ArtifactStagingDirectory)/tfplan"'

        # Convert the saved binary plan to readable text for human review.
        - task: PowerShell@2
          displayName: Generate Readable Terraform Plan
          inputs:
            targetType: inline
            script: |
              $tfDir = "$(terraformDirectory)"
              $planFile = "$(Build.ArtifactStagingDirectory)/tfplan"
              $reportFile = "$(Build.ArtifactStagingDirectory)/tfplan.txt"

              if (!(Test-Path $planFile)) {
                throw "Saved Terraform plan not found: $planFile"
              }

              Set-Location $tfDir
              terraform --version

              $showOutput = & terraform show -no-color $planFile 2>&1
              $showExitCode = $LASTEXITCODE
              $showOutput | Out-File $reportFile -Encoding utf8

              if ($showExitCode -ne 0) {
                Write-Host "terraform show failed. Diagnostic output was written to tfplan.txt."
                throw "Failed to generate readable Terraform plan. Check provider installation and the tfplan.txt output."
              }

              Write-Host "Readable plan created: $reportFile"

        # Publish both the binary plan and readable text in one artifact.
        - task: PublishPipelineArtifact@1
          displayName: Publish Terraform Plan and Readable Report
          condition: always()
          inputs:
            targetPath: '$(Build.ArtifactStagingDirectory)'
            artifact: terraform-plan

# 6. Manual approval: main branch only. Feature branches stop after Plan.
- stage: manual_approval
  displayName: Manual Approval
  dependsOn: terraform_plan
  condition: |
    and(
      succeeded(),
      eq(variables['Build.SourceBranch'], 'refs/heads/main')
    )
  jobs:
    - job: approval
      displayName: Review Terraform Plan
      pool: server
      timeoutInMinutes: 1440
      steps:
        - task: ManualValidation@1
          timeoutInMinutes: 1440
          inputs:
            notifyUsers: 'mailtomehdi133@gmail.com'
            approvers: 'mailtomehdi133@gmail.com'
            instructions: 'Review the terraform-plan artifact (tfplan and tfplan.txt) and relevant scan reports before approving deployment.'
            onTimeout: reject

# 7. Apply the exact saved plan after approval; do not create a new plan here.
- stage: terraform_apply
  displayName: Terraform Apply
  dependsOn: manual_approval
  condition: |
    and(
      succeeded(),
      eq(variables['Build.SourceBranch'], 'refs/heads/main')
    )
  jobs:
    - job: apply
      displayName: Apply Approved Terraform Plan
      steps:
        - checkout: self

        - task: TerraformInstaller@1
          displayName: Install Terraform
          inputs:
            terraformVersion: '$(terraformVersion)'

        - task: DownloadPipelineArtifact@2
          displayName: Download Saved Plan
          inputs:
            artifact: terraform-plan
            path: '$(Pipeline.Workspace)/terraform-plan'

        - task: TerraformTask@5
          displayName: Terraform Init
          inputs:
            provider: azurerm
            command: init
            workingDirectory: '$(terraformDirectory)'
            backendServiceArm: 'Azure-to-ADO'
            backendAzureRmStorageAccountName: 'tfstatestoragepipeline'
            backendAzureRmContainerName: 'tfstate'
            backendAzureRmKey: 'infra.tfstate'

        - task: PowerShell@2
          displayName: Verify Downloaded Plan
          inputs:
            targetType: inline
            script: |
              $planFile = "$(Pipeline.Workspace)/terraform-plan/tfplan"
              if (!(Test-Path $planFile)) {
                throw "Downloaded saved plan not found: $planFile"
              }
              Write-Host "Saved plan is present."
              terraform --version

        - task: TerraformTask@5
          displayName: Apply Saved Terraform Plan
          inputs:
            provider: azurerm
            command: apply
            workingDirectory: '$(terraformDirectory)'
            environmentServiceNameAzureRM: 'Azure-to-ADO'
            commandOptions: '"$(Pipeline.Workspace)/terraform-plan/tfplan"'
