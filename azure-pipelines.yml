pool: DevOps-Agents

trigger:
- main
- features/*

stages:
  - stage: terraform_install
    displayName: Installing terraform on self hosted VM
    jobs:
      - job: terraform_install
        steps:
        - task: TerraformInstaller@1
          inputs:
            terraformVersion: 'latest'

  - stage: terraform_init
    displayName: Terraform init
    jobs:
      - job: terraform_init
        steps:
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
            backendServiceArm: 'Azure-to-ADO'
            backendAzureRmStorageAccountName: 'tfstatestoragepipeline'
            backendAzureRmContainerName: 'tfstate'
            backendAzureRmKey: 'infra.tfstate'

  - stage: terraform_validate
    displayName: Validation in terraform
    jobs:
      - job: terraform_validate
        steps:
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'validate'
            terraformVersion: 'latest'
            workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'

  - stage: terraform_plan
    displayName: Init + Plan
    jobs:
      - job: plan
        displayName: Init + Plan
        steps:
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
            backendServiceArm: 'Azure-to-ADO'
            backendAzureRmStorageAccountName: 'tfstatestoragepipeline'
            backendAzureRmContainerName: 'tfstate'
            backendAzureRmKey: 'infra.tfstate'

        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'plan'
            workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
            environmentServiceNameAzureRM: 'Azure-to-ADO'

  - stage: manual_approval
    displayName: need manual approval on this
    jobs:
      - job: approval
        pool: server
        steps:
        - task: ManualValidation@1
          inputs:
            notifyUsers: 'mailtomehdi133@gmail.com'
            approvers: 'mailtomehdi133@gmail.com'
            instructions: 'Please review the Terraform Plan before approving the Apply stage.'
        

  - stage: terraform_apply
    dependsOn: manual_approval
    displayName: Init + Apply
    jobs:
    - job: terraform_apply
      steps:
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
            backendServiceArm: 'Azure-to-ADO'
            backendAzureRmStorageAccountName: 'tfstatestoragepipeline'
            backendAzureRmContainerName: 'tfstate'
            backendAzureRmKey: 'infra.tfstate'
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'apply'
            workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
            environmentServiceNameAzureRM: 'Azure-to-ADO'