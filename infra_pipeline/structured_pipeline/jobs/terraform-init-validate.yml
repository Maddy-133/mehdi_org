  jobs:
    - job: init_validate
      steps:
        - checkout: self

        - task: TerraformTask@5
          displayName: Terraform Init
          inputs:
            provider: azurerm
            command: init
            workingDirectory: '$(Build.SourcesDirectory)/terraform/env/${{ parameters.environment }}'
            backendServiceArm: 'Azure-to-ADO'
            backendAzureRmStorageAccountName: 'infraautopipeline'
            backendAzureRmContainerName: 'infrapipeline'
            backendAzureRmKey: '${{ parameters.environment }}.infrapipeline'

        - task: TerraformTask@5
          displayName: Terraform Validate
          inputs:
            provider: azurerm
            command: validate
            workingDirectory: '$(Build.SourcesDirectory)/terraform/env/${{ parameters.environment }}'
