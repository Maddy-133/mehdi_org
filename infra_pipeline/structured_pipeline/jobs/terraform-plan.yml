  jobs:
    - job: plan
      displayName: Create Terraform Plan
      steps:
        - checkout: self

        - task: TerraformTask@5
          displayName: Terraform Init
          inputs:
            provider: azurerm
            command: init
            workingDirectory: '$(Build.SourcesDirectory)/terraform/env/${{ parameters.environment }}'
            backendServiceArm: 'Azure-to-ADO'
            backendAzureRmStorageAccountName: 'infraautopipeline'
            backendAzureRmContainerName: 'infrapipeline'
            backendAzureRmKey: '${{ parameters.environment }}.infrapipeline'

        - task: TerraformTask@5
          displayName: Terraform Plan
          inputs:
            provider: azurerm
            command: plan
            workingDirectory: '$(Build.SourcesDirectory)/terraform/env/${{ parameters.environment }}'
            environmentServiceNameAzureRM: 'Azure-to-ADO'
            commandOptions: '-out="$(Build.ArtifactStagingDirectory)/tfplan"'

        - task: PublishPipelineArtifact@1
          displayName: Publish Saved Plan
          inputs:
            targetPath: '$(Build.ArtifactStagingDirectory)/tfplan'
            artifact: terraform-plan
